name: Validate and publish SPHEREx Sky Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/analysis/package-lock.json
            apps/asteroids/package-lock.json
      - name: Install locked web dependencies
        run: npm run setup
      - name: Build portable static site
        run: npm run build
      - name: Validate web, coordinates and integration
        run: npm run test:web
      - uses: actions/configure-pages@v5
        if: github.repository == 'jp-feynman/stellarium-web-preview'
      - uses: actions/upload-pages-artifact@v4
        if: github.repository == 'jp-feynman/stellarium-web-preview'
        with:
          path: dist

  deploy:
    if: github.repository == 'jp-feynman/stellarium-web-preview'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
